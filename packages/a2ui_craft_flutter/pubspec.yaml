name: a2ui_craft_flutter
description: >-
  Flutter bindings for A2UI Craft: render framework-agnostic RFW templates as
  Flutter widgets, with behavior identical to the Jaspr adapter.
version: 0.1.0-dev.1
repository: https://github.com/yjbanov/a2ui_craft
issue_tracker: https://github.com/yjbanov/a2ui_craft/issues
topics:
  - generative-ui
  - rfw
  - flutter
  - ui

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  a2ui_craft: ^0.1.0-dev.1
  a2ui_craft_bridge: ^0.1.0-dev.1
  a2ui_core: ^0.0.1-wip002
  flutter:
    sdk: flutter

dev_dependencies:
  a2ui_craft_testing: ^0.0.1
  flutter_test:
    sdk: flutter
  # The custom-catalog test defines its own a2ui_core component schemas.
  json_schema_builder: any
  lints: ^4.0.0
