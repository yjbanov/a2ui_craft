name: craft
description: >-
  The A2UI Craft CLI — scaffold and manage ephemeral, data-only UI projects that
  deploy to a CDN and load into a host app at runtime.
version: 0.0.1
# Not published. The `craft` name is taken on pub.dev (unrelated package) and the
# CLI is still early — publishing needs a rename first. Before removing this,
# read skills/a2ui-craft-publishing/SKILL.md.
publish_to: none

environment:
  sdk: ^3.6.0

resolution: workspace

executables:
  craft:

dependencies:
  args: ^2.4.0
  path: ^1.9.0

dev_dependencies:
  a2ui_craft: any
  a2ui_craft_examples: any
  lints: ^4.0.0
  test: ^1.25.0
