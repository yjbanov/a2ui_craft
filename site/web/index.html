<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="scaffolded-by" content="https://github.com/schultek/jaspr" />

    <!-- Resolve all asset URLs from the site root, so deep links like
         /sample/contact_card still load main.dart.js, flutter_bootstrap.js, and
         the Flutter assets (which would otherwise be requested under /sample/). -->
    <base href="/" />

    <title>A2UI Craft</title>

    <!-- Material Icons web font, so the Jaspr `Icon` ligatures (class
         "material-icons") render as glyphs instead of literal text. -->
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />

    <!-- The generated CSS (all @css declarations from your components). -->
    <link rel="stylesheet" href="main.css" />

    <!-- The site's own chrome palette. Every pair resolves through CSS
         `light-dark()` against the root's `color-scheme`, which defaults to
         the browser/system preference and can be overridden by the global
         theme toggle (an inline `color-scheme: light|dark` on <html>, set by
         SiteTheme). A media query could not do this — it only sees the
         browser preference, never the override. (Sample surfaces are themed
         separately, by their project theme.) -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: light-dark(#ffffff, #202124);
        --fg: light-dark(#333333, #e8eaed);
        --muted: light-dark(#555555, #bdc1c6);
        --subtle: light-dark(#888888, #9aa0a6);
        --faint: light-dark(#bbbbbb, #5f6368);
        --border: light-dark(#eeeeee, #3c4043);
        --border-strong: light-dark(#cccccc, #5f6368);
        --panel: light-dark(#fafafa, #28292c);
        --card: light-dark(#ffffff, #2a2b2e);
        --accent: light-dark(#1a73e8, #8ab4f8);
        --accent-fg: light-dark(#ffffff, #202124);
        --error-bg: light-dark(#fdecea, #3c1d1b);
        --error-fg: light-dark(#b3261e, #f2b8b5);
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
      }

      /* The back-to-gallery button: an arrow in a circular badge. On hover the
         badge lights up in the accent and the arrow nudges left — a "go back"
         micro-interaction. The word "Gallery" used to sit beside it; the badge
         alone says the same thing in a third of the width, and the screen title
         next to it already names where you are. */
      .back-btn {
        display: inline-flex;
        align-items: center;
        flex: none;
        padding: 5px;
        border: none;
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        font: 500 14px system-ui, -apple-system, sans-serif;
        text-decoration: none;
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease;
      }
      .back-btn:hover {
        background: var(--panel);
        color: var(--fg);
      }
      .back-btn:active {
        transform: scale(0.98);
      }
      .back-btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .back-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 1px solid var(--border-strong);
        font-size: 15px;
        line-height: 1;
        transition: border-color 0.15s ease, color 0.15s ease,
          background 0.15s ease, transform 0.2s ease;
      }
      .back-btn:hover .back-badge {
        border-color: var(--accent);
        color: var(--accent);
        background: color-mix(in srgb, var(--accent) 12%, transparent);
        transform: translateX(-3px);
      }

      /* ---- Toolbars -------------------------------------------------------
         Every screen's bar is a single flex row that may wrap. The title takes
         the slack (min-width:0 so it can actually shrink — a flex item's
         default min-width:auto refuses to go below its content, which is what
         used to push the controls off a phone screen) and ellipsizes. */
      .toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .toolbar-title {
        flex: 1;
        min-width: 0;
        margin: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* The trailing controls, kept together so they wrap as one group. */
      .toolbar-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      /* Below the breakpoint a toolbar is exactly back + title + hamburger:
         every option-bearing control is `wide-only` and folds into the menu.
         Keeping a favoured few visible was tried and does not work — the bar
         wraps to a second row, which costs vertical space on every screen, on
         the axis a phone has least of, whether or not you touch a control. */
      @media (max-width: 720px) {
        .wide-only {
          display: none !important;
        }
      }
      @media (min-width: 721px) {
        .narrow-only {
          display: none !important;
        }
      }

      /* ---- Icons (lib/icons.dart) -----------------------------------------
         The chrome's arrows, caret, hamburger, pencil, and check are inline
         SVG, not Unicode characters. Those codepoints live in blocks most UI
         typefaces do not cover, so the browser picks a per-character fallback
         font we do not control: fine on a desktop, hairline and vertically
         off-centre on a physical phone. Geometry we ship renders the same
         everywhere. One rule sets the weight for the whole set. */
      .icon {
        /* Sized and inked from the control it sits in, exactly as the
           character it replaced was. */
        width: 1em;
        height: 1em;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        /* For the inline (non-flex) uses. A replaced element sits on the
           baseline by default, which puts it a touch high against lowercase
           text; this drops it onto the text's optical centre. Ignored where
           the parent is a flex container — there `align-items: center` has
           already done the job. */
        vertical-align: -0.125em;
      }
      .icon-solid {
        fill: currentColor;
        stroke: none;
      }

      /* ---- Segmented control (CraftSegmented) -----------------------------
         One bordered group, the active segment filled. The shared outline is
         the point: it reads as a single control with two positions, where two
         loose buttons read as two independent actions. */
      .segmented {
        display: inline-flex;
        flex: none;
        border: 1px solid var(--border-strong);
        /* Brands may restyle corners; 6px matches the menu triggers. */
        border-radius: var(--control-radius, 6px);
        overflow: hidden;
      }
      .segmented-item {
        padding: 6px 14px;
        border: none;
        background: var(--card);
        color: var(--fg);
        /* Inherited family, so a brand's font reaches this control. */
        font-family: inherit;
        font-size: 13px;
        line-height: 1.4;
        white-space: nowrap;
        cursor: pointer;
      }
      .segmented-item[aria-checked='true'] {
        background: var(--accent);
        color: var(--accent-fg);
      }
      .segmented-item:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }

      /* ---- Dropdown menu (CraftMenu) -------------------------------------- */
      .menu {
        position: relative;
        display: inline-flex;
        flex: none;
      }
      .menu-trigger {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border: 1px solid var(--border-strong);
        border-radius: 6px;
        background: var(--card);
        color: var(--fg);
        font: 13px system-ui, -apple-system, sans-serif;
        line-height: 1.4;
        cursor: pointer;
        white-space: nowrap;
      }
      .menu-trigger:hover {
        border-color: var(--accent);
      }
      .menu-trigger[data-active='true'] {
        background: var(--accent);
        color: var(--accent-fg);
        border-color: var(--accent);
      }
      /* A square target for the glyph-only triggers. 36px keeps it at the
         ~44px-with-gap touch size phones want without towering over the
         text controls beside it. */
      .menu-trigger-icon {
        justify-content: center;
        width: 36px;
        padding: 6px 0;
        font-size: 15px;
      }
      .menu-caret {
        font-size: 10px;
        opacity: 0.7;
      }
      .menu-panel {
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        z-index: 60;
        min-width: 168px;
        /* Never wider than the viewport, whichever edge it is anchored to. */
        max-width: calc(100vw - 24px);
        /* Nor taller than it: the phone overflow menu stacks every axis the
           bar gave up, which on a responsive, themed sample is five sections
           deep. Past that it scrolls rather than running off the bottom. */
        max-height: calc(100vh - 72px);
        overflow-y: auto;
        padding: 4px;
        border: 1px solid var(--border-strong);
        border-radius: 8px;
        background: var(--card);
        box-shadow: 0 8px 24px light-dark(rgba(0, 0, 0, 0.16), rgba(0, 0, 0, 0.5));
      }
      .menu-panel-end {
        left: auto;
        right: 0;
      }
      .menu-item {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 8px 10px;
        border: none;
        border-radius: 6px;
        background: transparent;
        color: var(--fg);
        font: 13px system-ui, -apple-system, sans-serif;
        text-align: left;
        white-space: nowrap;
        cursor: pointer;
      }
      .menu-item:hover {
        background: var(--panel);
      }
      .menu-item[aria-checked='true'] {
        color: var(--accent);
        font-weight: 600;
      }
      /* Reserve the check column so labels line up whether or not a row is
         selected. Sized to hold the check icon (1em of the row's 13px) rather
         than the narrower character it replaced. */
      .menu-check {
        display: inline-flex;
        align-items: center;
        width: 14px;
        flex: none;
      }
      /* A menu section heading, for the hamburger's grouped axes. */
      .menu-label {
        padding: 8px 10px 4px;
        color: var(--subtle);
        font: 600 11px system-ui, -apple-system, sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .menu-label:not(:first-child) {
        border-top: 1px solid var(--border);
        margin-top: 4px;
      }
    </style>

    <!-- TEMPORARY SHIM — remove once the upstream Flutter bug is fixed.
         (flutter/flutter: in a multi-view embedding, the semantics placeholder
         swallows pointer events meant for the host page. Reported upstream.)

         On mobile browsers the Flutter web engine stretches
         <flt-semantics-placeholder> — its "Enable accessibility" affordance —
         across the whole viewport so a screen-reader tap anywhere activates it.
         The engine appends it to <body>, NOT inside the flutter-view, so on
         mobile it blankets the entire Jaspr-rendered page and no tap ever
         reaches our DOM. (On desktop it is 1x1 at -1,-1 and harmless, which is
         why this only shows up on mobile.)

         Disabling hit-testing is deliberately the narrowest fix: the element
         stays in the DOM, keeps role=button / aria-label / tabindex=0, and
         remains focusable — so assistive tech can still reach and activate it
         (AT activation dispatches a click on the focused element directly,
         which does not go through hit-testing). Removing the element instead
         would drop the accessibility affordance altogether. CSS also beats a
         MutationObserver here: no lifecycle or timing race, and it keeps
         applying if the engine re-inserts or re-styles the element. -->
    <style>
      flt-semantics-placeholder {
        pointer-events: none !important;
      }
    </style>

    <!-- The Flutter manifest + bootstrap (embedded Flutter). -->
    <link rel="manifest" href="manifest.json" />
    <script src="flutter_bootstrap.js" async></script>

    <!-- The compiled Jaspr client entrypoint (web/main.dart). -->
    <script defer src="main.dart.js"></script>
  </head>
  <body></body>
</html>
