name: a2ui_craft_jaspr
description: >-
  Jaspr bindings for A2UI Craft: render framework-agnostic RFW templates as HTML
  DOM, with behavior identical to the Flutter adapter.
version: 0.1.0-dev.1
repository: https://github.com/yjbanov/a2ui_craft
issue_tracker: https://github.com/yjbanov/a2ui_craft/issues
topics:
  - generative-ui
  - rfw
  - jaspr
  - ui

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  a2ui_craft: ^0.1.0-dev.1
  a2ui_craft_bridge: ^0.1.0-dev.1
  a2ui_core: ^0.0.1-wip002
  jaspr: ^0.23.1
  web: ^1.0.0

dev_dependencies:
  a2ui_craft_testing: ^0.0.1
  jaspr_test: ^0.23.1
  # The custom-catalog test and a2ui_core seam spike define component schemas.
  json_schema_builder: any
  lints: ^4.0.0
  # `@TestOn('browser')` on the worker-runner conformance run.
  test: ^1.25.0
  # The Flex geometry conformance runs in a headless browser and reads real DOM
  # layout via getBoundingClientRect (dart test -p chrome).
  universal_web: any
