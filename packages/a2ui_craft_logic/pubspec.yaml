name: a2ui_craft_logic
description: >-
  Business logic for A2UI Craft mini-apps. Defines the session envelope spoken
  between a rendered surface and its driver — the author-written program that
  receives the surface's user events and answers with A2UI Transport messages —
  plus the host-side session and the reference runners.
version: 0.1.0-dev.1
repository: https://github.com/yjbanov/a2ui_craft
issue_tracker: https://github.com/yjbanov/a2ui_craft/issues
topics:
  - generative-ui
  - a2ui
  - mini-apps
  - ui

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  # The A2UI protocol messages the driver sends and the surface model the
  # session drives. This is the only dependency: the session layers entirely on
  # `a2ui_core`'s public seam, and the template engine (`a2ui_craft`) and the
  # framework adapters are deliberately absent — a driver never sees them.
  a2ui_core: ^0.0.1-wip002

dev_dependencies:
  # Test-only: the session tests read a component's resolved props through
  # `A2uiComponentBinding` to observe what a rendered surface would show. The
  # library itself never depends on the bridge.
  a2ui_craft_bridge: ^0.1.0-dev.1
  lints: ^4.0.0
  test: ^1.25.0
